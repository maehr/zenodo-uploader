name: Release

# Publishing is deliberate: a tag push, or a manual run. Nothing here fires on
# an ordinary commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run the full gate before shipping anything
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run pytest

      - name: Build the distributions
        run: uv build

      - name: Check that the tag matches the project version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "${REF_NAME}" != "v${version}" ]; then
            echo "tag ${REF_NAME} does not match version ${version}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # A human approves this environment before anything reaches PyPI. Configure
    # the reviewers under Settings > Environments > pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/zenodo-uploader
    permissions:
      contents: read
      # OIDC for PyPI trusted publishing. No long-lived API token is stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
