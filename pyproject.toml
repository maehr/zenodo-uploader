[project]
name = "zenodo-uploader"
version = "0.1.0"
description = "A Zenodo client: create, update, version, and publish records, from an agent or the CLI"
readme = "README.md"
authors = [
    { name = "Moritz Mähr", email = "14755525+maehr@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["zenodo", "doi", "datacite", "crossref", "open-science", "research-data", "mcp"]
dependencies = [
    "httpx2>=2.5",
    "mcp>=2.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "typer>=0.15",
]

[project.urls]
Repository = "https://github.com/maehr/zenodo-uploader"
Issues = "https://github.com/maehr/zenodo-uploader/issues"

[project.scripts]
zenodo-uploader = "zenodo_uploader.cli:app"
zenodo = "zenodo_uploader.cli:app"
zenodo-mcp = "zenodo_uploader.mcp:main"

[dependency-groups]
dev = [
    "commitizen>=4.4",
    "git-cliff>=2.10",
    "prek>=0.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.14",
    # AGENTS.md section 2: pin ty exactly while it is beta.
    "ty==0.0.1a21",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
# The example is a standalone PEP 723 script with its own dependencies.
exclude = ["examples"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --cov=zenodo_uploader --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests", "src"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
update_changelog_on_bump = false
